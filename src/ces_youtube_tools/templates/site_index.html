<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="ces-youtube-tools">
<meta name="robots" content="noindex, nofollow">
<title>Watching guides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&amp;family=Inter:wght@400..700&amp;display=swap">
<style>
:root {
  color-scheme: light;
  --font-body: "Literata", Charter, "Iowan Old Style", Georgia, "DejaVu Serif", serif;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg: #faf8f3;
  --text: #24272c;
  --muted: #6b707a;
  --border: #e3ded3;
  --accent: #1d6670;
  --accent-soft: #e2eeee;
  --pill-text: #134f58;
  --row-hover: #e8f0ef;
  --field: #fff;
  --field-border: #cfc8b9;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.5;
}

main {
  max-width: calc(68ch + 32px);
  margin: 0 auto;
  padding: 16px 16px 80px;
}

h1 {
  font-family: var(--font-ui);
  font-size: 2.1rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.25;
  margin: 1.3em 0 0.2em;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 18px;
  margin: 1em 0 0.8em;
  font-family: var(--font-ui);
  font-size: 14px;
  color: var(--muted);
}
/* `display: flex` above would otherwise win over the browser's `[hidden] { display: none }`. */
.controls[hidden] { display: none; }
.controls label { display: flex; align-items: center; gap: 6px; }
.controls .filter { flex: 1 1 16em; }
.controls select, .controls input, .controls button {
  font: inherit;
  color: var(--text);
  background: var(--field);
  border: 1px solid var(--field-border);
  border-radius: 6px;
  padding: 4px 8px;
}
.controls input { flex: 1; min-width: 0; }
.controls button { cursor: pointer; }
.controls button:hover { border-color: var(--accent); color: var(--accent); }
.controls :is(select, input, button):focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.count {
  margin: 0 0 1.5em;
  font-family: var(--font-ui);
  font-size: 14px;
  color: var(--muted);
}

.guides {
  list-style: none;
  margin: 0;
  padding: 0;
  border-top: 1px solid var(--border);
}
.guides li {
  padding: 12px 10px;
  border-bottom: 1px solid var(--border);
  transition: background-color 0.15s;
}
.guides li:hover { background: var(--row-hover); }
.guides a {
  color: var(--text);
  font-weight: 600;
  text-decoration: none;
}
.guides a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 14px;
  margin: 4px 0 0;
  font-family: var(--font-ui);
  font-size: 14px;
  color: var(--muted);
}
.meta time, .meta .length { font-variant-numeric: tabular-nums; }
.badge {
  padding: 0 0.6em;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--pill-text);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.7;
}
.empty { color: var(--muted); }
.group h2 {
  font-family: var(--font-ui);
  font-size: 1.15rem;
  font-weight: 650;
  margin: 1.6em 0 0.5em;
}

@media (prefers-reduced-motion: reduce) {
  .guides li { transition: none; }
}
</style>
</head>
<body>
<main>
<h1>Watching guides</h1>
<div class="controls" id="controls" hidden>
<label>Sort by <select id="sort"></select></label>
<label>Order <select id="order"></select></label>
<label>Group <select id="group"></select></label>
<label class="filter">Filter <input type="search" id="q" placeholder="Title or channel" autocomplete="off"></label>
<button type="button" id="reset">Reset view</button>
</div>
<p class="count" id="count" aria-live="polite">$count.</p>
<noscript><p class="empty">The list of guides needs JavaScript.</p></noscript>
<div id="listing"></div>
</main>
<script type="application/json" id="guides">$guides_json</script>
<script type="module" src="index.mjs"></script>
</body>
</html>
