[project]
name = "ces-youtube-tools"
version = "0.1.0"
description = "Browse a YouTube channel's latest videos and generate watching guides from their subtitles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "markdown-it-py>=4.2.0",
    "pydantic>=2.14.0",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.3",
]

[project.scripts]
ces-youtube-tools = "ces_youtube_tools.cli:APP"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ces_youtube_tools"]

[tool.ruff.lint]
# Imports are sorted by lort (length-first ordering), see .pre-commit-config.yaml.
extend-ignore = ["I001"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
