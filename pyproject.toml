[project]
name = "youtube-tools"
version = "0.1.0"
description = "Browse a YouTube channel's latest videos and generate watching guides from their subtitles"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
youtube-tools = "youtube_tools.cli:APP"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_tools"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
